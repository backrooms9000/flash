{% extends '_base.html' %}

{% extends '_base.html' %}

{% block content %}

<section>

    <h2 class="m-0 py-3">Conteúdo Recente</h2>

    {% if total == 0 %}

    <div class="alert alert-light text-center">
        Nenhum conteúdo disponível. Envie o seu!
    </div>

    {% else %}

        {% for content in contents %}

            <p><a href="{{ url_for('view', content_id=content.c_id) }}">{{ content.c_title }}</a></p>

        {% endfor %}

    {% endif %}

</section>

{% endblock %}
