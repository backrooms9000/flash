{# templates\view.html #}
{% extends '_base.html' %}
{% block main %}

<h2>{{ content.name }}</h2>
<p><img src="{{ content.photo }}" alt="{{ content.name }}"></p>
<p>{{ content.description }}</p>

Metadados:
<ul>
    <li>Cadastrado em {{ content.created_at }}</li>
    <li>Localizado em {{ content.location }}</li>
    <li>Ações: <a href="{{ url_for('edit', thing_id=content.id )}}">✏ Editar</a> | <a href="#delete">🗑 Apagar</a></a></li>
</ul>

<p><a href="{{ url_for('index') }}">◂ Página incial</a></p>

<script>
    const deleteLink = document.querySelector('a[href="#delete"]');
    deleteLink.addEventListener('click', function (event) {
        event.preventDefault();
        if (confirm('ATENÇÃO!\n\nTem certeza que deseja apagar "{{ content.name }}"?\nEssa ação é irreversível!')) {
            location.href = "{{ url_for('delete', thing_id=content.id) }}";
        }
    });
</script>

{% endblock %}
